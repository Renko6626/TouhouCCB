services:
  postgres:
    image: postgres:16-alpine
    container_name: thccb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: thccb
      POSTGRES_PASSWORD: ${PG_PASSWORD:-change_me}
      POSTGRES_DB: thccb
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不暴露到宿主机——backend 通过 Docker 内部网络 postgres:5432 连接
    # 如需从宿主机调试：docker compose exec postgres psql -U thccb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thccb"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    # 默认从本地 ./backend 构建镜像，开箱即用。
    # 若想用预构建镜像（如自己的 registry / GHCR），设置环境变量 BACKEND_IMAGE 即可，
    # 例：BACKEND_IMAGE=ghcr.io/<你的用户名>/thccb-backend:latest docker compose up -d
    image: ${BACKEND_IMAGE:-thccb-backend:latest}
    build:
      context: ./backend
    container_name: thccb-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8004:8004"
    volumes:
      - ./.env:/app/.env:ro
      - ./backend/data:/app/data
      - ./backups:/app/backups
    environment:
      - PYTHONPATH=.
    # 容器内用户 UID:GID 与宿主机一致（在 .env 设为你的 `id -u`:`id -g`，否则挂载卷可能权限错乱）
    user: "${UID:-1000}:${GID:-1000}"
    # 优雅停机：给 uvicorn 时间排空 SSE 长连接
    stop_grace_period: 8s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
