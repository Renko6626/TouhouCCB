<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMSR 与 FX 页面对比</title><style>body{font:14px system-ui;margin:24px;color:#111;background:#f4f4f4}h1{font-size:22px}nav{display:flex;gap:8px;margin:18px 0}button{border:1px solid #000;background:#fff;padding:8px 14px;cursor:pointer}button[aria-pressed=true]{background:#000;color:#fff}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}figure{margin:0;background:#fff;border:1px solid #bbb;padding:12px}figcaption{font-weight:700;margin-bottom:12px}img{display:block;max-width:100%;height:auto}a{color:#111}.panels img{width:auto;max-width:100%;margin:auto}@media(max-width:850px){.comparison{grid-template-columns:1fr}}small{color:#666}</style><h1>LMSR 与 FX 正式页面</h1><p>相同 1440×1000 画布，固定账户与行情数据。截图来自正式路由，未操作交易按钮或填写表单。</p><nav><button aria-pressed="true" data-mode="page">完整页面</button><button aria-pressed="false" data-mode="workbench">主区域与右侧</button><button aria-pressed="false" data-mode="panel">右侧面板</button></nav><div class="comparison"><figure><figcaption>LMSR：已有持仓，默认买入</figcaption><a id="lmsr-link" href="lmsr-page.png"><img id="lmsr" src="lmsr-page.png"></a><small>正式 /market/1/trade；面板宽 320px。</small></figure><figure><figcaption>FX：已有多头，默认开仓</figcaption><a id="fx-link" href="fx-page.png"><img id="fx" src="fx-page.png"></a><small>正式 /fx；面板宽 380px；金额为空，等待填写后报价。</small></figure></div><p><button id="cover" aria-pressed="false">查看 FX 全部回补状态</button></p><p><a href="fx-cover-page.png">FX 全部回补完整页面</a>　<a href="fx-cover-panel.png">FX 全部回补右侧面板</a></p><script>let mode='page',cover=false;function render(){document.querySelector('.comparison').classList.toggle('panels',mode==='panel');for(const name of ['lmsr','fx']){const src=`${name==='fx'&&cover?'fx-cover':name}-${mode}.png`;document.getElementById(name).src=src;document.getElementById(name+'-link').href=src}document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));document.getElementById('cover').setAttribute('aria-pressed',cover)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;render()});document.getElementById('cover').onclick=()=>{cover=!cover;render()}</script></html>
