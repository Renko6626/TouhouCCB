# TouhouCCB nginx 站点配置
# 用法：
#   sudo ln -s /home/deploy/TouhouCCB/deploy/nginx.conf /etc/nginx/sites-enabled/thccb.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS：用 certbot 自动签发
#   sudo certbot --nginx -d your-instance.example.com

# ── 压测白名单（远程 k6 机器 IP 填在这里，测前加，测后移除）──
# 白名单 IP 的 $rate_key 为空字符串，对任何 limit_req_zone 形同不存在。
geo $loadtest_ip {
    default            0;             # 生产默认启用限速；压测时只临时白名单具体压测机 IP
    # 127.0.0.1                    1;
    # <your-k6-machine-ipv4>/32    1;
    # <your-k6-machine-ipv6>/128   1;
}

map $loadtest_ip $rate_key {
    1   "";                   # 白名单：空 key → 跳过所有 limit_req
    0   $binary_remote_addr;  # 正常流量：按源 IP 限速
}

# ── 按"用户/token"限速的 key ──
# 给 /market/{buy,sell,quote} 用：每个登录用户独立桶（单用户 10 r/s），
# 防止前端高频调 quote 时同 IP 下多用户互相挤兑。
# $http_authorization 是 "Bearer <token>" 字符串：
#   * 同一用户 token 不变 → 进同一桶
#   * 白名单（$loadtest_ip=1）：空 key 跳过限速（保留压测兜底）
#   * 缺 Authorization 头（匿名调，理论上 401 不会到这里）：所有匿名挤同一空 key 桶
map $loadtest_ip $rate_key_user {
    1   "";                   # 白名单：跳过
    0   $http_authorization;  # 按 Bearer token 区分用户
}

# ── 速率限制区域（放在 server 块外部，或 http 块内）──
limit_req_zone $rate_key zone=api_general:10m rate=20r/s;
limit_req_zone $rate_key zone=api_auth:10m    rate=5r/s;
limit_req_zone $rate_key zone=api_admin:10m   rate=2r/s;
# 交易接口（buy/sell/quote）：按用户限速，单用户 10 r/s
limit_req_zone $rate_key_user zone=api_trade_user:10m rate=10r/s;

# ── /history/ 不可变历史段缓存（spec § 7.6）──
# 段内容 immutable：URL 含段起点，永不变化。回源次数 ≈ 段数，与在线人数无关。
proxy_cache_path /var/cache/nginx/thccb levels=1:2 keys_zone=thccb_hist:10m
                 max_size=1g inactive=30d;

server {
    server_name your-instance.example.com;  # 改成你的域名

    # ── 安全响应头 ──
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS：certbot 配置 HTTPS 后取消注释
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── gzip ──
    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;
    gzip_min_length 256;

    # ── 前端静态文件 ──
    root /home/deploy/TouhouCCB/thccb-frontend/dist;
    index index.html;

    # SPA fallback：所有非文件请求回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 构建产物带 hash，可长期缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── 认证接口（严格限速：防暴力破解）──
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # ── 交易接口（按用户限速：单 token 10 r/s，burst=20）──
    location ~ ^/api/v1/market/(buy|sell|quote) {
        limit_req zone=api_trade_user burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }

    # ── 管理面板（最严限速）──
    location /api/v1/admin/ {
        limit_req zone=api_admin burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── 不可变历史段（阶段 4）：后端吐 immutable，nginx 叠 30d 磁盘缓存 ──
    location /history/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache thccb_hist;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # ── 通用 API（宽松限速）──
    location /api/v1/ {
        limit_req zone=api_general burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
    }

    # ── SSE 流（需要关闭缓冲，不限速）──
    location /api/v1/stream/ {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_http_version 1.1;

        # 关键：关闭缓冲，否则 SSE 事件会被攒包
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # SSE 长连接超时（后端最大 1 小时）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── 后端 Swagger docs ──
    location /docs {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8004;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/your-instance.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/your-instance.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = your-instance.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name your-instance.example.com;
    return 404; # managed by Certbot


}
