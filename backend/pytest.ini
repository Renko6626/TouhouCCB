[pytest]
# pytest-asyncio：显式 strict + function-scoped loop（防止跨测试的 event loop 串味）
asyncio_mode = strict
# session-scope event loop：允许 conftest.py 的 module-scope client fixture 工作
# （function-scope async fixture 仍可以正常运行，pytest-asyncio 1.x 兼容向下）
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session

# pytest-timeout：单测试硬超时 30s，挂死立即自杀避免无限卡
timeout = 30
timeout_method = thread

# 单次跑最多容忍 10 个失败再停（防止某个根本性问题让全部测试逐个超时累积）
# -m "not pg"：PG 专用测试（tests/pg/）需要 TEST_PG_DATABASE_URL 指向一次性测试库，
# 默认整套不跑；显式跑法：TEST_PG_DATABASE_URL=... pytest -m pg tests/pg/
addopts = -v --tb=short --maxfail=10 -m "not pg"

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    pg: PostgreSQL 专用测试（需要 TEST_PG_DATABASE_URL，指向一次性测试库）
