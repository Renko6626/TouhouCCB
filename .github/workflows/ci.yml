name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ========================================
  # 后端：检查 + 构建 Docker 镜像
  # ========================================
  backend:
    name: Backend Check & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m venv venv
          ./venv/bin/pip install -r requirements.txt --quiet

      - name: Compile check
        run: |
          ./venv/bin/python -c "
          import py_compile, glob, sys
          files = glob.glob('app/**/*.py', recursive=True)
          fails = []
          for f in sorted(files):
              try:
                  py_compile.compile(f, doraise=True)
              except py_compile.PyCompileError as e:
                  fails.append(str(e))
          if fails:
              for f in fails:
                  print(f, file=sys.stderr)
              sys.exit(1)
          print(f'All {len(files)} files compiled OK')
          "

      - name: Import check
        run: |
          ./venv/bin/python -c "
          import sys
          try:
              from app.core.config import settings
              from app.core.oidc import OIDCClient
              from app.services.lmsr import calculate_lmsr_cost, quantize_cost, quantize_price
              from app.models.base import User, Market, Outcome, Position, Transaction
              from app.schemas.market import TradeRequest, QuoteRequest, ResolveRequest
              from app.schemas.user import UserSummary, HoldingRead
              from app.api.v1 import auth, user, market, chart
              print('All module imports OK')
          except Exception as e:
              print(f'Import failed: {e}', file=sys.stderr)
              sys.exit(1)
          "

      - name: Run tests
        # timeout 兜底：pytest-asyncio 退出偶发 hang，超时即杀，stdout 仍可见
        run: timeout 300 ./venv/bin/python -m pytest -q

      # Docker 镜像构建 + 推送（仅 push main）
      # 双推 GHCR + 阿里云 ACR：GHCR 当备份，ACR 给国内服务器 docker pull 用（GHCR 国内拉
      # 起来 300MB 镜像要半小时；阿里云 ACR 同区域内网 < 30s）。同一份 build 同时打两组
      # tags，不增加 build 时长。
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Aliyun ACR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # GHA layer cache（cache-from/to: type=gha）要求 buildx 的 docker-container
      # driver，ubuntu-latest 默认 docker driver 不支持 cache export。这一步切换。
      - name: Set up Docker Buildx
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
        uses: docker/setup-buildx-action@v3

      - name: Lowercase owner name
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
        run: echo "OWNER_LC=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/thccb-backend:latest
            ghcr.io/${{ env.OWNER_LC }}/thccb-backend:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/thccb-backend:latest
            ${{ secrets.ACR_REGISTRY }}/${{ secrets.ACR_NAMESPACE }}/thccb-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================
  # 前端：检查 + 构建 + 上传产物
  # ========================================
  frontend:
    name: Frontend Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thccb-frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: thccb-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
        # 生产构建变量从仓库 Secrets 注入（替代曾被追踪的 .env.production）。
        # fork 无这些 secret 时构建仍会成功，只是产物指向空配置（CI 检查用途）。
        env:
          VITE_CLIENT_TOKEN_SECRET: ${{ secrets.VITE_CLIENT_TOKEN_SECRET }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_TITLE: ${{ secrets.VITE_APP_TITLE }}
          VITE_CASDOOR_URL: ${{ secrets.VITE_CASDOOR_URL }}
          VITE_CASDOOR_CLIENT_ID: ${{ secrets.VITE_CASDOOR_CLIENT_ID }}
          VITE_CASDOOR_ORG: ${{ secrets.VITE_CASDOOR_ORG }}
          VITE_CASDOOR_APP: ${{ secrets.VITE_CASDOOR_APP }}

      # 上传 dist/ 供 deploy job 使用
      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: thccb-frontend/dist/
          retention-days: 3

  # ========================================
  # CD：镜像已推送，部署到生产服务器
  # 仅在 push main 时触发
  # ========================================
  deploy:
    name: Deploy
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'Renko6626'
    runs-on: ubuntu-latest

    steps:
      # checkout 让 runner 拿到 docker-compose.yml + deploy/，准备 rsync 推服务器
      - uses: actions/checkout@v4

      # 拿到前端构建产物
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      # rsync 前端静态文件到服务器
      - name: Deploy frontend via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete
          path: dist/
          remote_path: /home/deploy/TouhouCCB/thccb-frontend/dist/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      # rsync 后端部署配置（compose 文件 + deploy/ 目录）到服务器
      # 不再让服务器 git pull——国内到 github HTTPS 抖动严重、几乎每次都把重试用满
      # 才能拿到代码。runner（Azure 美国）→ 服务器 rsync 走我们自己的 ssh 通道稳定。
      - name: Deploy backend config via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: docker-compose.yml deploy/
          remote_path: /home/deploy/TouhouCCB/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_user: ${{ secrets.DEPLOY_USER }}
          remote_key: ${{ secrets.DEPLOY_KEY }}

      # SSH 执行后端部署脚本（docker compose pull + up）
      # 之前要先 git fetch/pull，国内 GitHub 网络抖动每次重试用满 50s 才进 deploy.sh。
      # 现在配置文件已由上一步 rsync 推到位，直接跑 deploy.sh 即可。
      - name: Deploy backend
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          # 默认 10 分钟；网络抽风时镜像拉取可能更慢，给到 30 分钟兜底
          command_timeout: 30m
          script: |
            cd /home/deploy/TouhouCCB
            bash deploy/deploy.sh

      # 远程健康检查
      - name: Remote health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script_stop: true
          script: |
            sleep 5
            curl -sf --max-time 10 http://127.0.0.1:8004/api/v1/market/list > /dev/null
            echo "Health check passed"
