risk:
  single_order_cap_cny: 50
  daily_loss_cap_cny: 100
  daily_turnover_cap_cny: 2000
  max_slippage_bps: 300
  min_seconds_between_orders: 3

client:
  rate_limit_per_sec: 8
  request_timeout_sec: 10

# WebUI（trader 进程内嵌的轻量监控页）。生产侧建议 ssh -L 8765:127.0.0.1:8765 访问，
# 不要 bind 0.0.0.0 裸暴露。
web:
  enabled: true
  host: 127.0.0.1
  port: 8765

strategies:
  - name: dca_market_1_outcome_yes
    type: dca
    enabled: false
    market_id: 1
    outcome_id: 1
    cny_per_buy: 5.0
    interval_hours: 6
    total_budget_cny: 200

  - name: grid_market_1_outcome_yes
    type: grid
    enabled: false
    market_id: 1
    outcome_id: 1
    price_low: 0.30
    price_high: 0.60
    grid_count: 6
    shares_per_grid: 2.0
    tick_interval_sec: 30

  - name: volharvest_market_1_outcome_1
    type: volharvest
    enabled: false
    market_id: 1
    outcome_id: 1
    # 价格统计（logit 空间）
    window_size: 100              # 滑窗 N 笔 SSE trade event
    k_sigma: 2.0                  # 触发阈值 = k_sigma * 1.4826 * MAD ≈ k_sigma * σ
    scale_mad: 1.0                # deadband 之外 tanh 的尺度
    min_mad_logit: 0.01           # MAD 太小则跳过，防除零和过敏感
    # 仓位
    base_shares: 500.0            # 目标底仓（inventory，非 alpha 判断）
    max_offset_shares: 200.0      # tanh 饱和上限 → 持仓范围 [300, 700]
    min_trade_shares: 5.0         # |delta| < 此值不下单
    max_trade_shares: 20.0        # |delta| > 此值 clip 到 ±max_trade_shares
    # Bootstrap
    bootstrap_max_step: 10.0      # 每次 bootstrap 最多补 N shares
    bootstrap_interval_sec: 30    # bootstrap 节流
    bootstrap_skip_if_overpriced: true  # 价格偏高时暂停 bootstrap
    # 周期校准
    reconcile_interval_sec: 300   # 5 分钟读一次真实持仓校准 _holding
    reconcile_tolerance: 1.0      # 差异 > 此值才覆盖 + log warning
    # 趋势过滤
    trend_guard_events: 5         # 最近 N 笔 trade 全同向 → 暂停逆势加仓

  - name: meanrev_market_1
    type: meanrev
    enabled: false
    market_id: 1
    # 二元市场专用！setup 校验 len(outcomes)==2
    ema_alpha: 0.10               # logit EMA 衰减；半衰期 ≈ 7 笔
    threshold_logit: 0.08         # 偏离阈值；≈ 价格 ±2% (p≈0.5 时)
    warmup_events: 20             # 冷启动跳过前 N 笔 SSE event
    trade_pct_of_cash: 0.05       # 在 |deviation|=threshold 时基础下单 = cash × 5%
    size_scale_cap: 3.0           # size = base × min(|deviation|/threshold, cap)；cap=1 关闭缩放
    min_trade: 10                 # floor 后 < 此值直接 skip（过滤残余小数 + 边际触发）
    max_holding_per_side: 200     # 单边持仓硬上限，防 cash 一夜烧光
