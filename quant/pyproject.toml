[project]
name = "thccb-quant"
version = "0.1.0"
description = "TouhouCCB quant trader"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "aiosqlite>=0.20",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.1",
    "setproctitle>=1.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["thccb_quant*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
